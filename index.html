<!DOCTYPE html>
<html lang="eng">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
    <title>Decorate a Cake</title>
  </head>
  <body>
    <div id="decorations">
      <img src="strawberry.jpg" id="strawberry" class="decoration">
      <img src="cherry.jpg" id="cherry" class="decoration">
      <img src="marshmallow.jpg" id="marshmallow" class="decoration">
      <img src="blueberry.jpg" id="blueberry" class="decoration">
      <img src="macaron.jpg" id="macaron" class="decoration">
      <img src="chocolate.jpg" id="chocolate" class="decoration">
      <img src="flower.jpg" id="flower" class="decoration">
    </div>
    <h3>Would you really put this on a cake?</h3>
    <div id="baddecorations">
      <img class="decoration bad-decoration"src="pepper.png" data-bad="true" draggable="true" alt="Pepper">
      <img class="decoration bad-decoration"src="onion.png" data-bad="true" draggable="true" alt="Onion">
      <img class="decoration bad-decoration"src="garlic.png" data-bad="true" draggable="true" alt="Garlic">
      <img class="decoration bad-decoration"src="scallion.png" data-bad="true" draggable="true" alt="Scallion">
      <img class="decoration bad-decoration"src="broccoli.png" data-bad="true" draggable="true" alt="Broccoli">
      <img class="decoration bad-decoration"src="wasabi.png" data-bad="true" draggable="true" alt="Wasabi">
      <img class="decoration bad-decoration"src="kimchi.png" data-bad="true" draggable="true" alt="Kimchi">
    </div>
    <div id="cake">
      <img src="cake.jpg" id="cake-image">
    </div>
    <div id="cakeButtons">
      <button id="reset" aria-label="Reset the cake">Reset</button>
    </div>
    <button id="candle" aria-label="Light the candle">
      <img src="candle-unlit.jpg" alt="Unlit Candle" id="candleImage" draggable="true">
    </button>
    <script src="sketch.js"></script>
  </body>
</html>
